name: Scrape (v2-ingestion)

# Reused v1 scraper engine (lib/scrapers + lib/ai/rules + lib/tagging + lib/v3
# enrichment), run independently on GitHub Actions. INITIALLY workflow_dispatch
# ONLY — test via manual dispatch; dedup by url_hash makes it safe to run
# alongside v1's scrape.yml. AT CUTOVER: uncomment `schedule` below AND disable
# v1's scrape.yml — only ONE scheduled scraper at a time (two would roughly
# double the Supabase-Nano Disk-IO load, the dominant consumer and the reason
# the cron is 3h not 2h). The Ç1 CF watchdog (maritime-reader-admin) should also
# be pointed at this workflow at cutover.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force scrape all enabled sources (ignore due interval)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 */3 * * *'   # every 3h — cron fallback so a stalled watchdog can't silently halt scraping.
                             # v1 (maritime-pulse) scrape schedule is OFF (verified 2026-07-29: last scheduled run Jun 18)
                             # → only ONE scheduled scraper. concurrency group below serializes cron with watchdog dispatches.

concurrency:
  group: scrape-v2-ingestion
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 45 not 25: a full run (54 sources, many Playwright/requires_js) was hitting
    # the 25-min cap and getting cancelled mid-run, leaving later sources (P&I /
    # class) stale. Public repo → GHA minutes are unlimited, so the longer cap is
    # free and lets a run actually finish. Per-source timeouts still bound any
    # single hung source. (2026-06-29)
    # 60 not 45: the per-source cap went 3m -> 6m (orchestrator.ts), so a run where
    # several slow sources all time out can cost ~30 min more than before. Runs
    # currently finish in 4-19 min, so this is headroom, not an expected duration.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium (for requires_js sources)
        run: npx playwright install --with-deps chromium
      - name: Run scraper
        id: scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional: AI summary/categorize. Falls back to rules if absent.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: best-effort stuck-scrape email (no-op if unset).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SCRAPE_FORCE: ${{ inputs.force && '1' || '' }}
          SCRAPE_RUNNER: cloud
        run: npx tsx scripts/cron-scrape.ts

      # DELTA AUTO-TRIGGER: only when this run actually inserted new articles, poke
      # the v2 site to rebuild its 2h delta feed + search index immediately instead
      # of waiting for the next scheduled delta cron (which is what left the site
      # looking daily-stale). concurrency group `maritime-r2-deploy` on the site side
      # serializes it against deploy-base, so there is no R2-manifest race.
      #
      # ⚠️ REQUIRES a secret the HUMAN must create: V2_DISPATCH_TOKEN = a fine-grained
      #    PAT (or classic `repo` token) with "Contents: read & write" / dispatch
      #    permission on tufanography/maritime-reader-v2. Do NOT invent a token. Until
      #    the secret exists this step no-ops (logged), so the workflow stays green.
      - name: Trigger v2 site delta deploy (only on new content)
        if: ${{ steps.scrape.outputs.inserted != '' && steps.scrape.outputs.inserted != '0' }}
        env:
          V2_DISPATCH_TOKEN: ${{ secrets.V2_DISPATCH_TOKEN }}
          INSERTED: ${{ steps.scrape.outputs.inserted }}
        run: |
          if [ -z "$V2_DISPATCH_TOKEN" ]; then
            echo "V2_DISPATCH_TOKEN not set — skipping delta trigger. Add the secret to enable auto-refresh ($INSERTED new articles this run)."
            exit 0
          fi
          echo "Dispatching fresh-content ($INSERTED new articles) to maritime-reader-v2…"
          curl -sf -X POST \
            -H "Authorization: Bearer $V2_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tufanography/maritime-reader-v2/dispatches \
            -d "{\"event_type\":\"fresh-content\",\"client_payload\":{\"inserted\":\"$INSERTED\"}}"
